name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prefer repository secret MWDAT_GITHUB_TOKEN; fallback to GitHub's token.
      GITHUB_TOKEN: ${{ secrets.MWDAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate DAT package token
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "Missing GITHUB_TOKEN for GitHub Packages resolution."
            echo "Set repository secret MWDAT_GITHUB_TOKEN with read:packages."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace
